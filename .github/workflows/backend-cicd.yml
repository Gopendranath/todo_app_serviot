name: Backend CI/CD

on:
  push:
    branches: [ jadu ]
    paths:
      - 'backend/**'
      - 'Caddyfile*'
  pull_request:
    branches: [ jadu ]
    paths:
      - 'backend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/jadu'

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # Load user environment to find pnpm/pm2/caddy
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # Add pnpm home to path if not already there
            export PNPM_HOME="$HOME/.local/share/pnpm"
            case ":$PATH:" in
              *":$PNPM_HOME:"*) ;;
              *) export PATH="$PNPM_HOME:$PATH" ;;
            esac

            # Ensure pm2 is also in path (if installed globally via nvm)
            # nvm use v22 --silent || nvm use default --silent

            cd /home/ubuntu/todo_app_serviot
            
            # Use git fetch + reset to avoid "divergent branches" error in CI/CD
            git fetch origin jadu
            git reset --hard origin/jadu
            
            cd backend
            pnpm install --frozen-lockfile
            pnpm build
            pm2 restart todo-backend || pm2 start dist/index.js --name todo-backend

      - name: Restart Caddy (Optional)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # Load user environment
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # Add pnpm home to path if not already there
            export PNPM_HOME="$HOME/.local/share/pnpm"
            case ":$PATH:" in
              *":$PNPM_HOME:"*) ;;
              *) export PATH="$PNPM_HOME:$PATH" ;;
            esac

            cd /home/ubuntu/todo_app_serviot
            caddy fmt --overwrite Caddyfile
            caddy fmt --overwrite Caddyfile.frontend
            caddy fmt --overwrite Caddyfile.backend
            git config user.email "github-actions@github.com"
            git config user.name "GitHub Actions"
            git add Caddyfile*
            git commit -m "chore: format Caddyfiles with caddy fmt" || echo "No changes to commit"
            sudo caddy reload --config /home/ubuntu/todo_app_serviot/Caddyfile
