name: Backend CI/CD

on:
  push:
    branches: [ jadu ]
    paths:
      - 'backend/**'
      - 'Caddyfile*'
  pull_request:
    branches: [ jadu ]
    paths:
      - 'backend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/jadu'

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /home/ubuntu/todo_app_serviot
            git pull origin jadu
            cd backend
            pnpm install --frozen-lockfile
            pnpm build
            pm2 restart todo-backend || pm2 start dist/index.js --name todo-backend

      - name: Restart Caddy (Optional)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /home/ubuntu/todo_app_serviot
            caddy fmt --overwrite Caddyfile
            caddy fmt --overwrite Caddyfile.frontend
            caddy fmt --overwrite Caddyfile.backend
            git config user.email "github-actions@github.com"
            git config user.name "GitHub Actions"
            git add Caddyfile*
            git commit -m "chore: format Caddyfiles with caddy fmt" || echo "No changes to commit"
            sudo caddy reload --config /home/ubuntu/todo_app_serviot/Caddyfile
